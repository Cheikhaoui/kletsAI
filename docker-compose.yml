services:
  postgres:
    image: postgres:16
    container_name: kletsai-postgres
    environment:
      POSTGRES_DB: kletsai
      POSTGRES_USER: ${DB_USER:-kletsai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kletsai}
    ports:
      - "5432:5432"
    volumes:
      - kletsai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kletsai} -d kletsai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kletsai-pgdata:
