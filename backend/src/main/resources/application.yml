spring:
  application:
    name: kletsai
  config:
    # Load secrets from the repo-root .env when running from /backend (missing file is fine).
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kletsai}
    username: ${DB_USER:kletsai}
    password: ${DB_PASSWORD:kletsai}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

kletsai:
  single-user-id: 00000000-0000-0000-0000-000000000001
  time-zone: Europe/Amsterdam
